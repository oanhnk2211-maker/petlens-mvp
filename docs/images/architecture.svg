<svg xmlns="http://www.w3.org/2000/svg" width="980" height="820" viewBox="0 0 980 820" style="background-color: #F8FAFC; font-family: 'PingFang SC', 'Microsoft YaHei', 'Inter', 'Segoe UI', sans-serif;">
  <defs>
    <marker id="arrow-pet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94A3B8" />
    </marker>
    <filter id="shadow-pet" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- 标题 -->
  <text x="490" y="40" fill="#0F172A" font-size="24" font-weight="bold" text-anchor="middle">PetLens 宠物视角多模态分析引擎</text>
  <text x="490" y="66" fill="#475569" font-size="14" text-anchor="middle">多模态识别 · 知识库与模型推理 · 个性化风险判断 · 历史归档</text>

  <!-- ===== 输入层 ===== -->
  <!-- 框1：Pet Profile -->
  <rect x="140" y="105" width="220" height="85" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow-pet)" />
  <text x="250" y="135" fill="#1E3A8A" font-size="16" font-weight="bold" text-anchor="middle">Pet Profile</text>
  <text x="250" y="160" fill="#475569" font-size="13" text-anchor="middle">年龄 / 物种 / 健康</text>
  <text x="250" y="180" fill="#475569" font-size="13" text-anchor="middle">行为特征</text>

  <!-- 框2：多模态识别模块 -->
  <rect x="580" y="105" width="260" height="85" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow-pet)" />
  <text x="710" y="133" fill="#1E3A8A" font-size="15" font-weight="bold" text-anchor="middle">多模态识别模块</text>
  <text x="710" y="157" fill="#64748B" font-size="12" text-anchor="middle">文字输入 / 图片上传 / 手机拍照</text>
  <text x="710" y="179" fill="#475569" font-size="12" text-anchor="middle">↓ 物品标准化识别</text>

  <!-- 箭头：Profile → 分析管道 -->
  <path d="M 250 190 L 250 220 L 405 220 L 405 245" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-pet)"/>
  <!-- 箭头：多模态 → 分析管道 -->
  <path d="M 710 190 L 710 220 L 575 220 L 575 245" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-pet)"/>

  <!-- ===== 分析管道 ===== -->
  <rect x="340" y="250" width="300" height="45" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5" filter="url(#shadow-pet)" />
  <text x="490" y="277" fill="#1E3A8A" font-size="17" font-weight="bold" text-anchor="middle">分析管道</text>

  <!-- 箭头：分析管道 → 本地知识库（大框内） -->
  <path d="M 490 295 L 490 315 L 340 315 L 340 335" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-pet)"/>

  <!-- ===== 知识库大框（包含本地知识库 + 模型推理作为外围补充） ===== -->
  <rect x="160" y="340" width="660" height="140" rx="10" fill="#F8FAFC" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#shadow-pet)" />

  <!-- 本地知识库（核心，内部框） -->
  <rect x="195" y="365" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow-pet)" />
  <text x="335" y="395" fill="#1E3A8A" font-size="16" font-weight="bold" text-anchor="middle">本地知识库</text>
  <text x="335" y="420" fill="#64748B" font-size="13" text-anchor="middle">结构化条目</text>
  <text x="335" y="440" fill="#64748B" font-size="13" text-anchor="middle">预设规则与匹配</text>

  <!-- 模型推理（外围补充，在知识库右侧/外围） -->
  <rect x="495" y="365" width="280" height="90" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#shadow-pet)" />
  <text x="635" y="395" fill="#1E3A8A" font-size="16" font-weight="bold" text-anchor="middle">模型推理</text>
  <text x="635" y="420" fill="#475569" font-size="13" text-anchor="middle">语义增强</text>
  <text x="635" y="440" fill="#475569" font-size="13" text-anchor="middle">细化补充</text>

  <!-- 大框内表示模型推理附加于本地知识库（用细线连接，无加号） -->
  <path d="M 475 410 L 490 410" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- 箭头：本地知识库 → 风险综合判断 -->
  <path d="M 335 480 L 335 510 L 490 510 L 490 525" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-pet)"/>

  <!-- ===== 风险综合判断 ===== -->
  <rect x="340" y="530" width="300" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow-pet)" />
  <text x="490" y="560" fill="#1E3A8A" font-size="17" font-weight="bold" text-anchor="middle">风险综合判断</text>

  <!-- 箭头：分叉到三个输出 -->
  <path d="M 490 580 L 490 600" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-pet)"/>
  <path d="M 490 600 L 490 615 L 240 615 L 240 635" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-pet)"/>
  <path d="M 490 600 L 490 635" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-pet)"/>
  <path d="M 490 600 L 490 615 L 740 615 L 740 635" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-pet)"/>

  <!-- ===== 三路输出 ===== -->
  <!-- 框5：雷达图 -->
  <rect x="140" y="640" width="200" height="55" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow-pet)" />
  <text x="240" y="670" fill="#1E3A8A" font-size="15" font-weight="bold" text-anchor="middle">雷达图</text>

  <!-- 框6：风险解释 -->
  <rect x="390" y="640" width="200" height="55" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow-pet)" />
  <text x="490" y="670" fill="#1E3A8A" font-size="15" font-weight="bold" text-anchor="middle">风险解释</text>

  <!-- 框7：处置建议 -->
  <rect x="640" y="640" width="200" height="55" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow-pet)" />
  <text x="740" y="670" fill="#1E3A8A" font-size="15" font-weight="bold" text-anchor="middle">处置建议</text>

  <!-- 箭头：三路汇聚到 SQLite（预留充足高度） -->
  <!-- 左路汇聚 -->
  <path d="M 240 695 L 240 720 L 490 720 L 490 740" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-pet)"/>
  <!-- 中路直下 -->
  <path d="M 490 695 L 490 740" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-pet)"/>
  <!-- 右路汇聚（直接连接到汇聚点） -->
  <path d="M 740 695 L 740 720 L 490 720" fill="none" stroke="#94A3B8" stroke-width="2"/>

  <!-- ===== SQLite 历史归档 ===== -->
  <rect x="340" y="745" width="300" height="50" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5" filter="url(#shadow-pet)" />
  <text x="490" y="775" fill="#1E3A8A" font-size="16" font-weight="bold" text-anchor="middle">SQLite 历史归档</text>
</svg>